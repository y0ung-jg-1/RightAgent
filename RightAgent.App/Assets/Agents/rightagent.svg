<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- RightAgent logo: a context menu whose first item is an AI sparkle, opened by a
       mouse pointer — "AI agents in the right-click menu". -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58A6F2"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <!-- context menu card -->
  <rect x="12" y="10" width="31" height="38" rx="6" fill="#FFFFFF"/>
  <!-- row 1: AI sparkle bullet + line -->
  <path d="M17 15.4c.55 1.9 1.35 2.7 3.25 3.25-1.9.55-2.7 1.35-3.25 3.25-.55-1.9-1.35-2.7-3.25-3.25 1.9-.55 2.7-1.35 3.25-3.25z" fill="#2563EB"/>
  <rect x="22.5" y="17.5" width="15" height="3.2" rx="1.6" fill="#334155"/>
  <!-- rows 2-3: dot + line -->
  <rect x="15.4" y="25.4" width="3.4" height="3.4" rx="1.2" fill="#94A3B8"/>
  <rect x="22.5" y="25.5" width="18" height="3.2" rx="1.6" fill="#334155"/>
  <rect x="15.4" y="33.4" width="3.4" height="3.4" rx="1.2" fill="#94A3B8"/>
  <rect x="22.5" y="33.5" width="11" height="3.2" rx="1.6" fill="#334155"/>
  <!-- mouse pointer, tip on the menu -->
  <g transform="translate(37,32) scale(1.3)">
    <path d="M0 0 L0 15.2 L4.2 11.8 L7 17.6 L9.6 16.6 L6.8 11 L11.6 11 Z"
          fill="#FFFFFF" stroke="#0F172A" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
</svg>
