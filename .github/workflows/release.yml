name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, and draft GitHub Release
    runs-on: windows-2025
    environment: release
    timeout-minutes: 40

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore WiX Toolset 7.0.0
        shell: pwsh
        run: |
          dotnet restore ./installer/RightAgent.Package.wixproj
          dotnet restore ./installer/RightAgent.Bundle.wixproj
          dotnet tool update --global wix --version 7.0.0
          wix eula accept wix7

      - name: Validate tag and manifest version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
              throw 'The release workflow must run from a tag.'
          }
          [xml]$manifest = Get-Content -LiteralPath './RightAgent.Package/Package.Release.appxmanifest' -Raw
          $version = [version]([string]$manifest.Package.Identity.Version)
          $expectedTag = "v$($version.Major).$($version.Minor).$($version.Build)"
          if ($version.Revision -gt 0) {
              $expectedTag += ".$($version.Revision)"
          }
          if ($env:GITHUB_REF_NAME -cne $expectedTag) {
              throw "Tag '$env:GITHUB_REF_NAME' does not match package version '$expectedTag'."
          }
          $releaseNotesPath = Join-Path $env:GITHUB_WORKSPACE "docs\releases\$($env:GITHUB_REF_NAME).md"
          if (-not (Test-Path -LiteralPath $releaseNotesPath -PathType Leaf)) {
              throw "Release notes are missing: $releaseNotesPath. Copy docs\releases\TEMPLATE.md and write complete Chinese and English sections before tagging."
          }
          "RIGHTAGENT_RELEASE_NOTES=$releaseNotesPath" >> $env:GITHUB_ENV
          & git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
              throw "Tagged commit '$env:GITHUB_SHA' is not reachable from origin/main."
          }

      - name: Test and build release identity
        shell: pwsh
        run: ./scripts/Build.ps1 -Configuration Release -PackageIdentity Release

      - name: Import protected signing certificate
        id: certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.RIGHTAGENT_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.RIGHTAGENT_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
              throw 'RightAgent release signing secrets are not configured.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'RightAgent.release.pfx'
          try {
              $pfxBytes = [Convert]::FromBase64String($env:PFX_BASE64)
          }
          catch {
              throw 'RIGHTAGENT_SIGNING_PFX_BASE64 is not valid base64.'
          }
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          [Array]::Clear($pfxBytes, 0, $pfxBytes.Length)
          $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $imported = @(Import-PfxCertificate -FilePath $pfxPath -Password $password -CertStoreLocation 'Cert:\CurrentUser\My' -Exportable)
          $certificate = $imported |
              Where-Object { $_.Subject -eq 'CN=RightAgent' -and $_.HasPrivateKey } |
              Sort-Object NotAfter -Descending |
              Select-Object -First 1
          if (-not $certificate) {
              throw 'The PFX does not contain a RightAgent release certificate with a private key.'
          }
          $cerPath = Join-Path $env:RUNNER_TEMP 'RightAgent.cer'
          Export-Certificate -Cert $certificate -FilePath $cerPath -Type CERT | Out-Null
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          "cer_path=$cerPath" >> $env:GITHUB_OUTPUT
          "RIGHTAGENT_IMPORTED_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          "RIGHTAGENT_TEMP_PFX=$pfxPath" >> $env:GITHUB_ENV

      - name: Sign complete package set
        shell: pwsh
        run: ./scripts/Sign-PackageSet.ps1 -Configuration Release -PackageIdentity Release -CertificateThumbprint '${{ steps.certificate.outputs.thumbprint }}'

      - name: Build and sign setup executable
        shell: pwsh
        run: ./scripts/New-SetupExecutable.ps1 -CertificatePath '${{ steps.certificate.outputs.cer_path }}'

      - name: Verify public release assets
        shell: pwsh
        run: |
          $setupFiles = @(Get-ChildItem -LiteralPath './artifacts/installer' -Filter 'RightAgent-*-x64-Setup.exe' -File -ErrorAction Stop)
          if ($setupFiles.Count -ne 1) {
              throw "Expected exactly one setup package, but found $($setupFiles.Count)."
          }
          $checksumPath = "$($setupFiles[0].FullName).sha256"
          if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) {
              throw 'The setup package SHA-256 file is missing.'
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $setupFiles[0].FullName
          if ($null -eq $signature.SignerCertificate -or
              $signature.SignerCertificate.Thumbprint -cne '${{ steps.certificate.outputs.thumbprint }}' -or
              $signature.Status -notin 'Valid', 'UnknownError' -or
              $null -eq $signature.TimeStamperCertificate) {
              throw "Setup executable signature verification failed: $($signature.Status)"
          }
          $actualHash = (Get-FileHash -LiteralPath $setupFiles[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedLine = (Get-Content -LiteralPath $checksumPath -Raw).Trim()
          $expectedChecksumLine = "$actualHash  $($setupFiles[0].Name)"
          if ($expectedLine -cne $expectedChecksumLine) {
            throw 'The setup executable does not match its SHA-256 file.'
          }

      - name: Smoke-test Setup installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setupFiles = @(Get-ChildItem -LiteralPath './artifacts/installer' -Filter 'RightAgent-*-x64-Setup.exe' -File -ErrorAction Stop)
          if ($setupFiles.Count -ne 1) {
            throw "Expected exactly one setup package, but found $($setupFiles.Count)."
          }

          $setupLog = Join-Path $env:RUNNER_TEMP 'RightAgent-Setup-smoke.log'
          $setupProcess = Start-Process -FilePath $setupFiles[0].FullName -ArgumentList @(
            '-silent',
            '-norestart',
            '-log',
            $setupLog
          ) -WindowStyle Hidden -PassThru
          if (-not $setupProcess.WaitForExit(300000)) {
            throw 'Setup did not finish within five minutes.'
          }
          if ($setupProcess.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $setupLog -PathType Leaf) {
              Write-Host (Get-Content -LiteralPath $setupLog -Raw)
            }
            throw "Setup exited with code $($setupProcess.ExitCode)."
          }
          if (-not (Test-Path -LiteralPath $setupLog -PathType Leaf)) {
            throw 'Setup did not create its diagnostic log.'
          }

          $setupLogText = Get-Content -LiteralPath $setupLog -Raw
          Write-Host $setupLogText
          if ($setupLogText -match 'raised an exception|QuerySpawnServer|Unexpected response|0x800704c7|Please locate') {
            throw 'Setup logged an installation exception.'
          }
          if ($setupLogText -notmatch 'Apply complete, result: 0x0') {
            throw 'Setup did not report a successful Burn apply result.'
          }
          [xml]$manifest = Get-Content -LiteralPath './RightAgent.Package/Package.Release.appxmanifest' -Raw
          $expectedVersion = [version]([string]$manifest.Package.Identity.Version)
          $appExecutable = Join-Path $env:ProgramFiles 'RightAgent\RightAgent.App.exe'
          if (-not (Test-Path -LiteralPath $appExecutable -PathType Leaf)) {
            throw "Setup did not install the unpackaged settings app to '$appExecutable'."
          }
          $installRecordPath = Join-Path $env:LOCALAPPDATA 'RightAgent\install.json'
          if (-not (Test-Path -LiteralPath $installRecordPath -PathType Leaf)) {
            throw 'Setup did not write install.json.'
          }
          $legacyMain = Get-AppxPackage -Name 'RightAgent' -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -ceq 'RightAgent' -and $_.Publisher -ceq 'CN=RightAgent' } |
            Select-Object -First 1
          if ($legacyMain) {
            throw 'Setup left a packaged settings app registered.'
          }

          $command00 = Get-AppxPackage -Name 'RightAgent.Command00' -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -ceq 'RightAgent.Command00' -and $_.Publisher -ceq 'CN=RightAgent' } |
            Select-Object -First 1
          if (-not $command00 -or [version]$command00.Version -ne $expectedVersion) {
            throw "A clean Setup must register command package slot 00 at version $expectedVersion."
          }
          foreach ($slot in 1..15) {
            $commandName = "RightAgent.Command$($slot.ToString('D2'))"
            $unexpected = Get-AppxPackage -Name $commandName -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -ceq $commandName -and $_.Publisher -ceq 'CN=RightAgent' } |
              Select-Object -First 1
            if ($unexpected) {
              throw "A clean Setup must not register unused command package '$commandName'."
            }
          }

          $cacheDirectory = Join-Path $env:LOCALAPPDATA 'RightAgent\CommandPackages'
          $cachedPackages = @(Get-ChildItem -LiteralPath $cacheDirectory -Filter '*.msix' -File -ErrorAction SilentlyContinue)
          if ($cachedPackages.Count -ne 16) {
            throw "Setup did not cache all 16 command packages. Found $($cachedPackages.Count) in '$cacheDirectory'."
          }

          $shortcutPath = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\RightAgent\RightAgent.lnk'
          if (-not (Test-Path -LiteralPath $shortcutPath -PathType Leaf)) {
            throw "Setup did not create the Start menu shortcut at '$shortcutPath'."
          }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcutPath)
          if ($shortcut.TargetPath -cne $appExecutable) {
            throw "Start menu shortcut target was '$($shortcut.TargetPath)', expected '$appExecutable'."
          }

          $rightAgentStartApps = @(Get-StartApps | Where-Object {
            $_.Name -like 'RightAgent*' -or $_.AppID -like '*RightAgent*'
          })
          $unexpectedStart = @($rightAgentStartApps | Where-Object {
            $_.Name -like 'RightAgent.Command*' -or $_.AppID -like '*RightAgent.Command*'
          })
          if ($unexpectedStart.Count -gt 0) {
            $visibleApps = ($unexpectedStart | ForEach-Object { "$($_.Name) [$($_.AppID)]" }) -join ', '
            throw "Command packages must not appear in Start. Found: $visibleApps"
          }

          $publicCertificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new('${{ steps.certificate.outputs.cer_path }}')
          if (-not (Test-Path -LiteralPath "Cert:\LocalMachine\TrustedPeople\$($publicCertificate.Thumbprint)")) {
            throw 'Setup did not trust the RightAgent public certificate in Local Machine\\Trusted People.'
          }
          if (Test-Path -LiteralPath "Cert:\LocalMachine\Root\$($publicCertificate.Thumbprint)") {
            throw 'Setup incorrectly trusted the RightAgent certificate as a root certificate.'
          }

      - name: Upload signed workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RightAgent-${{ github.ref_name }}
          path: |
            artifacts/installer/RightAgent-*-x64-Setup.exe
            artifacts/installer/RightAgent-*-x64-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create or update draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $setup = @(Get-ChildItem -LiteralPath './artifacts/installer' -Filter 'RightAgent-*-x64-Setup.exe' -File -ErrorAction Stop)
          if ($setup.Count -ne 1) {
              throw "Expected exactly one setup package, but found $($setup.Count)."
          }
          $assets = @($setup[0].FullName, "$($setup[0].FullName).sha256")
          & gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
              & gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
              if ($LASTEXITCODE -ne 0) {
                  throw 'GitHub Release asset upload failed.'
              }
          } else {
              & gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --draft --verify-tag --notes-file $env:RIGHTAGENT_RELEASE_NOTES --title "$tag"
              if ($LASTEXITCODE -ne 0) {
                  throw 'GitHub Release creation failed.'
              }
          }
          & gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes-file $env:RIGHTAGENT_RELEASE_NOTES --title "$tag"
          if ($LASTEXITCODE -ne 0) {
              throw 'GitHub Release notes update failed.'
          }

      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          if ($env:RIGHTAGENT_TEMP_PFX -and (Test-Path -LiteralPath $env:RIGHTAGENT_TEMP_PFX)) {
              Remove-Item -LiteralPath $env:RIGHTAGENT_TEMP_PFX -Force
          }
          if ($env:RIGHTAGENT_IMPORTED_THUMBPRINT) {
              $certificatePath = "Cert:\CurrentUser\My\$env:RIGHTAGENT_IMPORTED_THUMBPRINT"
              if (Test-Path -LiteralPath $certificatePath) {
                  Remove-Item -LiteralPath $certificatePath -Force
              }
          }
