name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, and draft GitHub Release
    runs-on: windows-2025
    environment: release
    timeout-minutes: 40

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $version = '6.7.3'
          $installerUri = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $expectedHash = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          $installerPath = [IO.Path]::GetFullPath((Join-Path $runnerTemp "innosetup-$version.exe"))
          if (-not [IO.Directory]::GetParent($installerPath).FullName.Equals($runnerTemp, [StringComparison]::OrdinalIgnoreCase) -or
              [IO.Path]::GetFileName($installerPath) -cne "innosetup-$version.exe") {
              throw "Refusing to use an unexpected Inno Setup download path: $installerPath"
          }
          try {
              Invoke-WebRequest -Uri $installerUri -OutFile $installerPath
              $actualHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualHash -cne $expectedHash) {
                  throw "Inno Setup SHA-256 mismatch. Expected $expectedHash, found $actualHash."
              }
              $process = Start-Process -FilePath $installerPath -ArgumentList @(
                  '/VERYSILENT',
                  '/SUPPRESSMSGBOXES',
                  '/NORESTART',
                  '/SP-',
                  '/CURRENTUSER'
              ) -WindowStyle Hidden -Wait -PassThru
              if ($process.ExitCode -ne 0) {
                  throw "Inno Setup installation failed with exit code $($process.ExitCode)."
              }
          }
          finally {
              if (Test-Path -LiteralPath $installerPath -PathType Leaf) {
                  Remove-Item -LiteralPath $installerPath -Force -ErrorAction Stop
              }
          }
          $iscc = Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
              throw "Inno Setup compiler was not found after installation: $iscc"
          }

      - name: Validate tag and manifest version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
              throw 'The release workflow must run from a tag.'
          }
          [xml]$manifest = Get-Content -LiteralPath './RightAgent.Package/Package.Release.appxmanifest' -Raw
          $version = [version]([string]$manifest.Package.Identity.Version)
          $expectedTag = "v$($version.Major).$($version.Minor).$($version.Build)"
          if ($version.Revision -gt 0) {
              $expectedTag += ".$($version.Revision)"
          }
          if ($env:GITHUB_REF_NAME -cne $expectedTag) {
              throw "Tag '$env:GITHUB_REF_NAME' does not match package version '$expectedTag'."
          }
          & git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
              throw "Tagged commit '$env:GITHUB_SHA' is not reachable from origin/main."
          }

      - name: Test and build release identity
        shell: pwsh
        run: ./scripts/Build.ps1 -Configuration Release -PackageIdentity Release

      - name: Import protected signing certificate
        id: certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.RIGHTAGENT_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.RIGHTAGENT_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
              throw 'RightAgent release signing secrets are not configured.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'RightAgent.release.pfx'
          try {
              $pfxBytes = [Convert]::FromBase64String($env:PFX_BASE64)
          }
          catch {
              throw 'RIGHTAGENT_SIGNING_PFX_BASE64 is not valid base64.'
          }
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          [Array]::Clear($pfxBytes, 0, $pfxBytes.Length)
          $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $imported = @(Import-PfxCertificate -FilePath $pfxPath -Password $password -CertStoreLocation 'Cert:\CurrentUser\My' -Exportable)
          $certificate = $imported |
              Where-Object { $_.Subject -eq 'CN=RightAgent' -and $_.HasPrivateKey } |
              Sort-Object NotAfter -Descending |
              Select-Object -First 1
          if (-not $certificate) {
              throw 'The PFX does not contain a RightAgent release certificate with a private key.'
          }
          $cerPath = Join-Path $env:RUNNER_TEMP 'RightAgent.cer'
          Export-Certificate -Cert $certificate -FilePath $cerPath -Type CERT | Out-Null
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          "cer_path=$cerPath" >> $env:GITHUB_OUTPUT
          "RIGHTAGENT_IMPORTED_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          "RIGHTAGENT_TEMP_PFX=$pfxPath" >> $env:GITHUB_ENV

      - name: Sign package
        shell: pwsh
        run: ./scripts/Sign-Package.ps1 -Configuration Release -PackageIdentity Release -CertificateThumbprint '${{ steps.certificate.outputs.thumbprint }}'

      - name: Create verified installer payload
        shell: pwsh
        run: |
          . ./scripts/PackageHelpers.ps1
          $package = Get-RightAgentPackagePath -RepoRoot $env:GITHUB_WORKSPACE -Configuration Release -PackageIdentity Release
          ./scripts/New-ReleaseBundle.ps1 -PackagePath $package -CertificatePath '${{ steps.certificate.outputs.cer_path }}'
          $releaseZip = Get-ChildItem -LiteralPath './artifacts/release' -Filter '*.zip' -File -ErrorAction Stop
          if (@($releaseZip).Count -ne 1) {
              throw 'Expected exactly one release ZIP.'
          }
          ./scripts/Verify-ReleaseBundle.ps1 -ZipPath $releaseZip.FullName

      - name: Build and sign setup executable
        shell: pwsh
        run: ./scripts/New-SetupExecutable.ps1

      - name: Verify public release assets
        shell: pwsh
        run: |
          $setupFiles = @(Get-ChildItem -LiteralPath './artifacts/installer' -Filter 'RightAgent-*-x64-Setup.exe' -File -ErrorAction Stop)
          if ($setupFiles.Count -ne 1) {
              throw "Expected exactly one setup executable, but found $($setupFiles.Count)."
          }
          $checksumPath = "$($setupFiles[0].FullName).sha256"
          if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) {
              throw 'The setup executable SHA-256 file is missing.'
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $setupFiles[0].FullName
          if ($null -eq $signature.SignerCertificate -or
              $signature.SignerCertificate.Thumbprint -cne '${{ steps.certificate.outputs.thumbprint }}' -or
              $signature.Status -notin 'Valid', 'UnknownError' -or
              $null -eq $signature.TimeStamperCertificate) {
              throw "Setup executable signature verification failed: $($signature.Status)"
          }
          $actualHash = (Get-FileHash -LiteralPath $setupFiles[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedLine = (Get-Content -LiteralPath $checksumPath -Raw).Trim()
          $expectedChecksumLine = "$actualHash  $($setupFiles[0].Name)"
          if ($expectedLine -cne $expectedChecksumLine) {
              throw 'The setup executable does not match its SHA-256 file.'
          }

      - name: Upload signed workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RightAgent-${{ github.ref_name }}
          path: |
            artifacts/installer/RightAgent-*-x64-Setup.exe
            artifacts/installer/RightAgent-*-x64-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create or update draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $setup = @(Get-ChildItem -LiteralPath './artifacts/installer' -Filter 'RightAgent-*-x64-Setup.exe' -File -ErrorAction Stop)
          if ($setup.Count -ne 1) {
              throw "Expected exactly one setup executable, but found $($setup.Count)."
          }
          $assets = @($setup[0].FullName, "$($setup[0].FullName).sha256")
          & gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
              & gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          } else {
              & gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --draft --verify-tag --generate-notes --title "RightAgent $tag"
          }
          if ($LASTEXITCODE -ne 0) {
              throw 'GitHub Release creation or upload failed.'
          }

      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          if ($env:RIGHTAGENT_TEMP_PFX -and (Test-Path -LiteralPath $env:RIGHTAGENT_TEMP_PFX)) {
              Remove-Item -LiteralPath $env:RIGHTAGENT_TEMP_PFX -Force
          }
          if ($env:RIGHTAGENT_IMPORTED_THUMBPRINT) {
              $certificatePath = "Cert:\CurrentUser\My\$env:RIGHTAGENT_IMPORTED_THUMBPRINT"
              if (Test-Path -LiteralPath $certificatePath) {
                  Remove-Item -LiteralPath $certificatePath -Force
              }
          }
