name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build unsigned release package
    runs-on: windows-2025
    timeout-minutes: 50

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Test and build
        shell: pwsh
        run: ./scripts/Build.ps1 -Configuration Release -PackageIdentity Release

      - name: Locate and verify unsigned package set
        id: package
        shell: pwsh
        run: |
          . ./scripts/PackageHelpers.ps1
          $package = Get-RightAgentPackagePath -RepoRoot $env:GITHUB_WORKSPACE -Configuration Release -PackageIdentity Release
          $commandPackages = @(Get-RightAgentCommandPackagePaths -RepoRoot $env:GITHUB_WORKSPACE -Configuration Release -PackageIdentity Release)
          $packageSet = @($package) + $commandPackages
          if ($packageSet.Count -ne 17) {
              throw "CI must produce one main package and 16 command packages, but found $($packageSet.Count)."
          }
          foreach ($packagePath in $packageSet) {
            $signature = Get-AuthenticodeSignature -LiteralPath $packagePath
            if ($signature.Status -ne 'NotSigned') {
                throw "CI package '$packagePath' must remain unsigned, but signature status is $($signature.Status)."
            }
          }
          "path=$package" >> $env:GITHUB_OUTPUT

      - name: Build unsigned Setup.exe
        shell: pwsh
        run: |
          $cerDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts\ci-signing'
          New-Item -ItemType Directory -Path $cerDirectory -Force | Out-Null
          $cerPath = Join-Path $cerDirectory 'RightAgent.cer'
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=RightAgent' `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -NotAfter (Get-Date).AddDays(1)
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
          ./scripts/New-SetupExecutable.ps1 -SkipSigning -CertificatePath $cerPath
          $setup = @(Get-ChildItem -LiteralPath './artifacts/installer' -Filter 'RightAgent-*-x64-Setup.exe' -File)
          if ($setup.Count -ne 1) {
              throw "CI must produce exactly one unsigned per-machine Setup.exe, but found $($setup.Count)."
          }
          $userSetup = @(Get-ChildItem -LiteralPath './artifacts/installer' -Filter 'RightAgent-*-x64-UserSetup.exe' -File)
          if ($userSetup.Count -ne 1) {
              throw "CI must also compile the local UserSetup SKU, but found $($userSetup.Count)."
          }

      - name: Upload unsigned CI package set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RightAgent-unsigned-ci-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.path }}
            artifacts/package/Release/Commands/*.msix
            artifacts/installer/RightAgent-*-x64-Setup.exe
            artifacts/installer/RightAgent-*-x64-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 7
